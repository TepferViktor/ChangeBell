<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>ChangeBell</title>
    <link rel="stylesheet" type="text/css" href="/libs/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="general.css">
    <script src="/libs/featherlight/jquery.min.js"></script>
    <script src="/both/i18n.js"></script>
    <script src="/both/common.js"></script>
    <script src="/pages/page-common.js"></script>
</head>
<body>
<div class="container">
    <div class="brand">
        <img src="/icons/icon-48.png" alt="" width="40" height="40">
        <span class="brand-name" data-i18n="brandName"></span>
    </div>

    <div class="row">
        <div class="col-5">
            <label for="selectedtext" class="header" data-i18n="lookFor"></label>
        </div>
        <div class="col-7">
            <textarea readonly class="form-control data-text" id="selectedtext"></textarea>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <span class="header" data-i18n="nextReload"></span> <span class="data-time-remaining"></span>
        </div>
    </div>

    <br>
    <p class="optiontext text-left">
        <span data-i18n="monitoringNow"></span><br>
        <span data-i18n="leaveRunning"></span>
    </p>
    <div id="actiondiv" class="text-center">
        <button id="stop" type="button" class="btn btn-danger col-5" data-i18n="stop"></button>
    </div>
    <button id="reload" class="btn btn-link btn-sm" data-i18n="reloadNow"></button> |
    <button id="update" class="btn btn-link btn-sm" data-i18n="updateSettings"></button> |
    <button id="hide" class="btn btn-link btn-sm" data-i18n="hideDialog"></button>
</div>
<script src="/pages/overlay.js"></script>
</body>
</html>
